<!-- BPC confidence grid — paste this ONE block into a WordPress "Custom HTML" block.
     Identical in shape to a normal Datawrapper embed: one iframe + the standard
     Datawrapper resize script. The iframe points at our own hosted grid page,
     which reports its height in Datawrapper's message format, so the script
     below sizes it exactly as it would size a chart.

     To change the LAYOUT later, edit docs/2026/confidence.html on the BPC upstream repo
     (Bipartisan-Policy-Center/election-information-surveys) and push.
     Nothing here needs to be re-pasted. -->
<iframe title="Confidence that votes will be counted as intended." aria-label="Chart grid" id="datawrapper-chart-bpcgrid" src="https://bipartisan-policy-center.github.io/election-information-surveys/2026/confidence.html" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="420" data-external="1"></iframe><script type="text/javascript">(function(){function e(){window.addEventListener(`message`,function(e){if(e.data[`datawrapper-height`]!==void 0){var t=document.querySelectorAll(`iframe`);for(var n in e.data[`datawrapper-height`])for(var r=0,i;i=t[r];r++)if(i.contentWindow===e.source){var a=e.data[`datawrapper-height`][n]+`px`;i.style.height=a}}})}e()})();</script>
